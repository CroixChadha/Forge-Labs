<!DOCTYPE html>

<html>
    <head>
    
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
    <header>
        <h1>New Hire Setup Request Form</h1>
    </header>
    <main>
        
    <form action="https://testforgpt.com/example" method="post" id="form"> 
        
        <br>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required placeholder="First name, Last name">
        <br><br>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email">
        <br><br>
        <label for="date">Start Date</label>
        <input type="date" id="date" name="date" required>
        <br><br>
        <fieldset id="emptype">
        <legend>Employment Type:</legend>
        <br>
        <label for="intern">Intern</label>
        <input type="radio" name="emp-type" required id="intern">
        <br><br>
        <label for="Contractor">Contractor</label>
        <input type="radio" name="emp-type" required id="Contractor">
        <br><br>
        <label for="fulltime">Full Time</label>
        <input type="radio" name="emp-type" required id="fulltime">
        </fieldset>
        <br><br>
            <fieldset id="Equipment">
            <legend>Equipment Needed:</legend>
        <label for="Laptop">Laptop</label>
        <input type="checkbox" id="Laptop" name="Laptop" >
        <br><br>
        <label for="Monitor">Monitor</label>
        <input type="checkbox" id="Monitor" name="Monitor" >
        <br><br>
        <label for="Badge">Badge</label>
        <input type="checkbox" id="Badge" name="Badge" >
        <br><br>
        <label for="Headset">Headset</label>
        <input type="checkbox" id="Headset" name="Headset">
        <br><br>
        <label for="None">None</label>
        <input type="checkbox" id="None" name="None">
        </fieldset>
        <br><br>
        <h2>Notes (Optional):</h2>
        <textarea id="Notes" name="Notes" placeholder="Type any notes here!"></textarea>

        <br><br>
        <input type="submit" id="submit" name="submit" value="Submit Here!">
    
        
    </form>
    </main>
    <br><br><br>
    <footer>
        Contact information: +1 454-876-9087, help@business.com, <a href="https://help-support.com/form">https://help-support.com/form</a>
    </footer>
    </body>
</html>
