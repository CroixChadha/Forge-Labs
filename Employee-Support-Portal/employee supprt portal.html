<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Employee Support Portal</title>
    
</head>
<body>
    <header>
        <h1>Internal Employee Support Portal</h1>
    </header>
    <main>
    
    <form action="https://testforgpt.com/example" method="post" id="form">
        
        <p>
            This form allows you to shed some light on issues you have internally.
        </p>
        <label for="name">Employee Name:</label>
        <input type="text" id="name" name="name" placeholder="First name, Last name" required>
        <br>
        <br>
        <label for="email">Work Email:</label>
        <input type="email" id="email" name="email" placeholder="example@work.com" required>
        <br>
        <br>
        <label for="department">Department:</label>
        <select id="department" name="department" required>
            <option value="Choose an Option" disabled selected hidden>Choose an option</option>
            <option value="IT" >IT</option>
            <option value="HR" >HR</option>
            <option value="Sales" >Sales</option>
            <option value="Engineering" >Engineering</option>
            <option value="Security">Security</option>
            <option value="AI Eng">AI Engineer</option>
            <option value="Field">Field</option>
        </select>
        <br><br>
        <label for="Category">Issue Category:</label>
        <select id="Category" name="category" required>
            <option value="Choose an Option" disabled selected hidden>Choose an option</option>
            <option value="harassment">Harassment</option>
            <option value="Injury" >Injury</option>
            <option value="Violation of company policy">Violation of company policy</option>
        </select>
        <br><br>
        <label for="urgency">Urgency</label>
        <select id="urgency" name="urgency" required>
            <option value="Choose an Option" disabled selected hidden>Choose an Option</option>
            <option value="100">HIGHEST</option>
            <option value="75" >High</option>
            <option value="50" >Medium</option>
            <option value="25" >Low</option>
            <option value="0"  >LOWEST</option>
        </select>
        <br><br>
        <label for="issue-description" >Issue Description:</label>
        <textarea id="issue-description" name="issue description" required></textarea>
        

        <br><br>
        <label for="contact">Preferred Contact Method:</label>
        <select id="contact" name="contact"required>
            <option value="Choose an Option" disabled selected hidden>Choose an option</option>
            <option value="Email">Email</option>
            <option value="text" >SMS</option>
            <option value="call" >Call</option>
        </select>
        <br><br><br>
        <label for="submit">Submit the form:</label>
        <input type="submit" name="submit" id="submit">
    </form>
    </main>
    <br><br><br><br>
    <footer>
    Contact information: +1 454-876-9087, help@business.com, <a href="https://help-support.com/form">https://help-support.com/form</a>
</footer>
</body>



</html>
